<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planner - LaserGround Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dashboard">LaserGround Planner</a>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/planner">Planner</a>
        <a href="/login" id="logout-link">Logout</a>
      </nav>
    </header>

    <main class="planner-layout">
      <section class="planner-panel">
        <h1>Transmission Planner</h1>
        <form id="planner-form" class="form-grid">
          <label>
            Source terminal
            <select id="source-terminal" name="source_terminal_id" required></select>
          </label>
          <label>
            Data volume GB
            <input name="data_volume_gb" type="number" min="0.1" max="10000" step="0.1" value="120" required>
          </label>
          <label>
            Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            Min availability score
            <input name="min_availability_score" type="number" min="0" max="1" step="0.01" value="0.75" required>
          </label>
          <button type="submit">Build plan</button>
        </form>
        <div id="planner-message" class="message" aria-live="polite"></div>
        <div id="plan-result" class="result-grid"></div>
      </section>
      <section class="map-section">
        <div id="planner-map" class="map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/planner.js"></script>
  </body>
</html>
